[project]
name = "qrit"
version = "3.0.0"
description = "QRit v3 - Enterprise QR Code SaaS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django~=6.1.1",
    "djangorestframework~=3.18.1",
    "drf-spectacular~=0.30.0",
    "psycopg[binary,pool]~=3.3.6",
    "psycopg-pool>=3.3.3",
    "procrastinate[django]~=3.10.0",
    "redis[hiredis]~=8.1.0",
    "gunicorn~=26.2",
    "uvicorn-worker~=0.4.0",
    "uvicorn~=0.54.0",
    "granian~=2.8.4",
    "orjson~=3.12.0",
    "cachetools>=5.5.0",
    "pydantic-settings~=2.15.0",
    "whitenoise~=6.12.0",
    "django-cors-headers~=4.9.0",
    "cryptography~=50.0.0",
    "argon2-cffi~=25.1.0",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]~=2.15.0",
    "authlib~=1.8.0",
    "joserfc~=1.7.0",
    "requests>=2.32.0",
    "pysaml2~=7.5.5",
    "pyotp~=2.10.0",
    "webauthn~=3.0.1",
    "dnspython~=2.8.0",
    "httpx~=0.28.1",
    "openpyxl~=3.1.5",
    "segno~=1.6.6",
    "resvg-py~=0.5.0",
    "reportlab~=5.0.1",
    "pillow~=12.3.0",
    "razorpay~=2.0.1",
    "stripe>=15.6.0",
    "resend>=2.48.0",
    "sentry-sdk~=2.71.0",
    "structlog~=26.1.0",
    "phonenumberslite>=8.13.0",
]

[dependency-groups]
dev = [
    "ruff~=0.16.10",
    "mypy~=2.4.0",
    "django-stubs~=6.1.1",
    "django-stubs-ext~=6.1.1",
    "djangorestframework-stubs~=3.18.1",
    "pytest~=9.1.1",
    "pytest-django~=4.14.0",
    "pytest-asyncio~=1.4.0",
    "pytest-xdist~=3.8.0",
    "pytest-cov~=7.1.0",
    "factory-boy~=3.3.3",
    "hypothesis>=6.120.0",
    "numpy>=2.0.0",
    "scikit-image>=0.24.0",
    "zxing-cpp>=2.2.0",
    "responses~=0.26.3",
    "respx~=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qrit", "apps"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.13"
files = ["apps", "qrit"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apps.*.domain.*",
    "apps.*.services",
    "apps.*.selectors",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "apps.*.tests.*",
    "apps.*.migrations.*",
    "tests.*",
    "qrit.settings.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "qrit.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "qrit.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
