app = "qrit-api"
primary_region = "bom"

[build]
  dockerfile = "../../services/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    hard_limit = 2000
    soft_limit = 1500

[[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
