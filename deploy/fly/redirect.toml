app = "qrit-redirect"
primary_region = "bom"

[build]
  dockerfile = "../../services/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 4

  [http_service.concurrency]
    type = "connections"
    hard_limit = 10000
    soft_limit = 8000

[[http_service.checks]]
  grace_period = "3s"
  interval = "5s"
  method = "GET"
  path = "/healthz"
  timeout = "1s"

# Deployed across multi-region edge locations (bom, sin, fra, iad)
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 512
