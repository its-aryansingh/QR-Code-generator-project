app = "qrit-render"
primary_region = "bom"

[build]
  dockerfile = "../../apps/render/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 350

[[http_service.checks]]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/healthz"
  timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
