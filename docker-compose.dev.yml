version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "True"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8084
    ports:
      - "8084:8084"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # The browser calls /api/v1 on the frontend; it forwards to the backend.
      BACKEND_INTERNAL_URL: http://backend:8084
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"
