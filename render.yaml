services:
  - type: web
    name: qrit-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --fake-initial --noinput
    startCommand: python manage.py runserver 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 8084
      - key: DATABASE_URL
        fromDatabase:
          name: qrit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DEBUG
        value: "False"

  - type: web
    name: qrit-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://qrit-backend.onrender.com/api/v1"

databases:
  - name: qrit-db
    databaseName: qrit
    user: qrit
    plan: free
