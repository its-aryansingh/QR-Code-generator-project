services:
  postgres:
    image: postgres:17-alpine
    container_name: qrit-postgres
    environment:
      POSTGRES_DB: qrit
      POSTGRES_USER: qrit
      POSTGRES_PASSWORD: qrit_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrit -d qrit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qrit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: qrit-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: qrit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrit-api
    command: gunicorn qrit.asgi:application -k uvicorn_worker.UvicornWorker -c gunicorn.conf.py
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: qrit.settings.api
      PORT: "8080"
      DATABASE_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8080
      SHORT_DOMAIN: localhost:8090
      DJANGO_SECRET_KEY: local-dev-secret-key-at-least-50-characters-long-safe-to-commit
      APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==
      SCAN_SALT_SECRET: local-dev-scan-salt-secret-32-bytes-minimum
      EDGE_SHARED_SECRET: local-dev-edge-shared-secret-32-chars-min
      SERIAL_MAC_KEY: local-dev-serial-mac-key-32-bytes-minimum
      VERIFY_TOKEN_KEY: local-dev-verify-token-key-32-bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrit-redirect
    command: "granian --interface asginl --host :: --port 8090 qrit.asgi:application"
    ports:
      - "8090:8090"
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: qrit.settings.redirect
      PORT: "8090"
      DATABASE_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      SHORT_DOMAIN: localhost:8090
      DJANGO_SECRET_KEY: local-dev-secret-key-at-least-50-characters-long-safe-to-commit
      APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==
      SCAN_SALT_SECRET: local-dev-scan-salt-secret-32-bytes-minimum
      EDGE_SHARED_SECRET: local-dev-edge-shared-secret-32-chars-min
      SERIAL_MAC_KEY: local-dev-serial-mac-key-32-bytes-minimum
      VERIFY_TOKEN_KEY: local-dev-verify-token-key-32-bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrit-worker
    command: sh -c "python manage.py wait_for_migrations && python manage.py procrastinate worker"
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: qrit.settings.worker
      DATABASE_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      DATABASE_UNPOOLED_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: local-dev-secret-key-at-least-50-characters-long-safe-to-commit
      APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==
      SCAN_SALT_SECRET: local-dev-scan-salt-secret-32-bytes-minimum
      EDGE_SHARED_SECRET: local-dev-edge-shared-secret-32-chars-min
      SERIAL_MAC_KEY: local-dev-serial-mac-key-32-bytes-minimum
      VERIFY_TOKEN_KEY: local-dev-verify-token-key-32-bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrit-ingest
    command: sh -c "python manage.py wait_for_migrations && python -c 'import time; time.sleep(999999)'"
    environment:
      APP_ENV: local
      DJANGO_SETTINGS_MODULE: qrit.settings.worker
      DATABASE_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      DATABASE_UNPOOLED_URL: postgresql://qrit:qrit_dev_password@postgres:5432/qrit
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: local-dev-secret-key-at-least-50-characters-long-safe-to-commit
      APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==
      SCAN_SALT_SECRET: local-dev-scan-salt-secret-32-bytes-minimum
      EDGE_SHARED_SECRET: local-dev-edge-shared-secret-32-chars-min
      SERIAL_MAC_KEY: local-dev-serial-mac-key-32-bytes-minimum
      VERIFY_TOKEN_KEY: local-dev-verify-token-key-32-bytes-min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
