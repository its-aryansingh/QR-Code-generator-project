services:
  postgres:
    image: postgres:17-alpine
    container_name: qrit-postgres
    environment:
      POSTGRES_DB: qrit
      POSTGRES_USER: qrit
      POSTGRES_PASSWORD: qrit_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrit -d qrit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qrit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: qrit-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: qrit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        CMD: api
    container_name: qrit-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://qrit:qrit_dev_password@postgres:5432/qrit?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8080
      PLATFORM_SHORT_DOMAIN: localhost:8090
      RENDER_URL: http://render:8081
      COOKIE_SECURE: "false"
      JWT_ED25519_PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIHsV70EaTfZ+kS1xM6g6eM+VpD7kP8E3jK1qR9sT2uX/
      JWT_KEY_ID: dev-key-1
      APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXktMzJieXRlcw==
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        CMD: redirect
    container_name: qrit-redirect
    ports:
      - "8090:8090"
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
      HTTP_ADDR: ":8090"
      DATABASE_URL: postgres://qrit:qrit_dev_password@postgres:5432/qrit?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      WEB_INTERNAL_URL: http://web:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  render:
    build:
      context: ./apps/render
      dockerfile: Dockerfile
    container_name: qrit-render
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      RENDER_SHARED_SECRET: dev-render-secret

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: qrit-web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SHORT_DOMAIN: localhost:8090
      API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
      - redirect

volumes:
  postgres_data:
  redis_data:
  minio_data:
